# Strict by intent. vane's failure modes are quiet: a switch over a mode or a
# chip that silently falls through, an ignored error on a bus transaction that
# leaves stale data looking fresh, a missing doc comment that ships a contract
# (units, flags, when an error is per-sensor) that exists only in the author's
# head. None of those produce a stack trace on a sensor reading.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - contextcheck
    - copyloopvar
    - dupl
    - errorlint
    - exhaustive
    - gocritic
    - godot
    - goconst
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - unconvert
    - unparam
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      # Every switch over Mode, Chip or a driver state handles every value. A
      # missing case defaulting to "continuous" or "no flags" is invisible in
      # review and in a plausible-looking reading.
      default-signifies-exhaustive: true
    goconst:
      ignore-tests: true
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, rangeValCopy]
    govet:
      enable-all: true
      disable: [fieldalignment]
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: package-comments

  exclusions:
    rules:
      # Table-driven conversion tests are repetitive by nature, and a test that
      # ignores a cleanup error is not the risk this configuration exists for.
      - path: _test\.go$
        linters: [dupl, errcheck, gosec, goconst, unparam]
      # internal/conformance is test code that go test cannot see as such: its two
      # chips are checked in parallel on purpose, so that a change to one reads
      # next to the other and does not hide behind a shared helper.
      - path: ^internal/conformance/
        linters: [dupl, errcheck, goconst]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/JonasBorgesLM/vane]
